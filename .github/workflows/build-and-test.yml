name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # net48 + WinForms + COM interop; needs a Windows runner regardless of the .NET SDK used to build it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build MiniPlayerBand.csproj -c Release

      - name: Test
        run: dotnet test Tests/MiniPlayerBand.Tests/MiniPlayerBand.Tests.csproj -c Release
